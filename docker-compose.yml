services:
  mysql:
    image: mysql:8.0
    container_name: mysql_shoe_store
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: shoe_store
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - shoe_network

  tomcat:
    image: tomcat:9.0
    container_name: tomcat_shoe_store
    depends_on:
      - mysql
    ports:
      - "8080:8080"
    volumes:
      - ./target:/usr/local/tomcat/webapps
    networks:
      - shoe_network

volumes:
  mysql_data:

networks:
  shoe_network:
    driver: bridge